name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test numerical behavior, saved weights and app
        run: python -m pytest -q --junitxml=results/tests.xml
      - name: Verify committed evaluation evidence
        run: python scripts/evaluate.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: results/tests.xml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t diffusion-six .
      - name: Start container and check health
        shell: bash
        run: |
          docker run -d --name diffusion-six -p 8501:8501 diffusion-six
          for i in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs diffusion-six
          exit 1
      - name: Container logs
        if: always()
        run: docker logs diffusion-six || true
